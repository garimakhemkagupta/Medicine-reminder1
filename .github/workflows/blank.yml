name: Build Medicine Reminder APK

# Builds the app automatically in the cloud (GitHub's own servers) every
# time you push to this repo, or when you trigger it manually from the
# Actions tab. No Android Studio, no SDK install, nothing on your own
# computer required.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This project has no committed Gradle wrapper jar, so we install
      # Gradle directly instead of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medicine-reminder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
